syntax = "proto3";

package taskgrid;

message WorkerInfo {
  string worker_id = 1;
  repeated string task_types = 2;
  string address = 3;
  int32 port = 4;
  string status = 5;
  int32 current_load = 6;
}

message HeartbeatRequest {
  string worker_id = 1;
  int64 timestamp = 2;
  int32 current_load = 3;
}

message TaskRequest {
  string request_id = 1;
  int32 task_id = 2;
  string task_type = 3;
  string task_payload = 4;
}

message TaskResponse {
  string status = 1;
  int32 task_id = 2;
  string worker_id = 3;
  string error = 4;
}

message ResultRequest {
  string request_id = 1;
  int32 task_id = 2;
  string worker_id = 3;
  string status = 4;
  string result = 5;
  string error = 6;
}

message Ack {
  bool success = 1;
  string message = 2;
}

service NamingService {
  rpc RegisterWorker(WorkerInfo) returns (Ack);
  rpc SendHeartbeat(HeartbeatRequest) returns (Ack);
  rpc DeregisterWorker(WorkerInfo) returns (Ack);
}

service DispatcherService {
  rpc ReturnResult(ResultRequest) returns (Ack);
}

service WorkerService {
  rpc ExecuteTask(TaskRequest) returns (TaskResponse);
}